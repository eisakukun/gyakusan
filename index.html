<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>逆算</title>
<style>
:root{
  --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --line:#2a323c;
  --tx:#e8edf3; --dim:#8d9aa8; --dim2:#5f6c7a;
  --ok:#3ddc97; --warn:#ffb454; --ng:#ff6b6b; --acc:#6aa9ff;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 0}
h2{font-size:15px;color:var(--dim);margin:22px 0 8px;font-weight:600;letter-spacing:.04em}
h2:first-child{margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.muted{color:var(--dim);font-size:13px}
.tiny{color:var(--dim2);font-size:12px;line-height:1.6}

/* header */
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 2px 10px}
.clock{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock span{font-size:16px;color:var(--dim);font-weight:500;margin-left:6px}
.here{font-size:13px;color:var(--dim);text-align:right}
.here b{display:block;color:var(--tx);font-size:15px}
.here{cursor:pointer}
.here small{display:block;color:var(--ok);font-size:11px}
.here small.no{color:var(--dim2)}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.pcard .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.pcard .top .ttl{flex:1;font-weight:700}
.pcard .ctl{display:flex;gap:6px;align-items:center}
.pcard .ctl input{width:70px;padding:8px;text-align:right}
.pcard .ctl select{flex:1;padding:8px;font-size:14px}
.gps{background:var(--panel2);border:1px solid var(--line);color:var(--acc);border-radius:9px;
  padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.gps.has{color:var(--ok);border-color:#2c5348}
.est{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.est b{color:var(--acc)}

/* hero */
.hero{background:linear-gradient(160deg,#1b2531,#151a21);border:1px solid #2c3947;border-radius:20px;padding:18px;margin-bottom:12px}
.hero .lbl{font-size:13px;color:var(--dim);margin-bottom:2px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.hero .sub{font-size:14px;color:var(--dim);margin-top:8px}
.hero.go{background:linear-gradient(160deg,#3a1f22,#241417);border-color:#5e2c30}
.hero.go .big{color:var(--ng)}
.bar{height:6px;background:#252d37;border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
/* ledger */
.ldg{margin-top:14px;border-top:1px solid #2c3947;padding-top:10px}
.lr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;font-size:14px}
.lr b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lr.m{color:var(--dim);font-size:13px}
.lr.m i{font-style:normal;font-size:11px;color:var(--dim2)}
.lr.tot{border-top:1px dashed #33404e;margin-top:6px;padding-top:10px;font-size:16px}
.lr.tot b{font-size:30px;color:var(--ok);letter-spacing:-.02em}
.lr.tot.bad b{color:var(--ng);font-size:24px}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#08131f}
.ck.on{background:var(--ok);border-color:var(--ok)}
.row.off{opacity:.42}
.row{cursor:pointer}
.dn{background:none;border:1px solid var(--line);color:var(--dim2);font-size:11px;
  padding:5px 8px;border-radius:8px;cursor:pointer;flex-shrink:0}

/* now task */
.nowtask{background:linear-gradient(160deg,#16302a,#132420);border:1px solid #2c5348;border-radius:20px;padding:18px;margin-bottom:12px}
.nowtask .lbl{font-size:12px;color:var(--ok);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.nowtask .t{font-size:26px;font-weight:700;line-height:1.25}
.nowtask .m{font-size:14px;color:var(--dim);margin-top:6px}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.row.g{border-color:#2c5348;background:#14231f}
.row.a{border-color:#4a3a22;background:#241d13}
.row.x{opacity:.5}
.row .ttl{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .met{font-size:12px;color:var(--dim);white-space:nowrap}
.row .ico{width:26px;text-align:center;font-size:16px;flex-shrink:0}
.del{background:none;border:none;color:var(--dim2);font-size:20px;padding:0 2px;cursor:pointer;line-height:1}
.tagp{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#243040;color:var(--acc);margin-left:6px}
.taga{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#2a2438;color:#c39bff;margin-left:6px}

/* timeline */
.tl{position:relative;padding-left:16px;margin-top:4px}
.tl:before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tli{position:relative;display:flex;gap:12px;padding:7px 0;font-size:14px}
.tli:before{content:'';position:absolute;left:-16px;top:14px;width:10px;height:10px;border-radius:99px;background:var(--dim2);border:2px solid var(--bg)}
.tli.k:before{background:var(--warn)}
.tli.f:before{background:var(--ng)}
.tli time{font-variant-numeric:tabular-nums;color:var(--dim);width:52px;flex-shrink:0;font-weight:600}
.tli.k time,.tli.f time{color:var(--tx)}

/* forms */
input,select,button,textarea{font-family:inherit;font-size:16px}
.f{display:flex;flex-direction:column;gap:8px}
.f label{font-size:12px;color:var(--dim);margin-bottom:-4px}
input[type=text],input[type=number],input[type=datetime-local],select{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);
  border-radius:11px;padding:12px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#08131f;border:none;border-radius:12px;padding:13px;font-weight:700;width:100%;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#08131f;font-weight:700}
.two{display:flex;gap:8px}.two>*{flex:1}

/* verdict */
.vd{border-radius:18px;padding:18px;margin-bottom:10px}
.vd.y{background:linear-gradient(160deg,#16302a,#132420);border:1px solid #2c5348}
.vd.n{background:linear-gradient(160deg,#331d1f,#221315);border:1px solid #55292d}
.vd .h{font-size:24px;font-weight:800;margin-bottom:6px}
.vd.y .h{color:var(--ok)}.vd.n .h{color:var(--ng)}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,18,22,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav button{flex:1;background:none;border:none;color:var(--dim2);padding:10px 2px 12px;
  font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--acc)}
.pg{display:none}.pg.on{display:block}
.empty{text-align:center;color:var(--dim2);font-size:14px;padding:24px 10px;line-height:1.8}
</style>
<meta name="apple-mobile-web-app-title" content="逆算">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
  /* 全画面アプリとして開くと、上はノッチ・下はホームバーに潜り込む。
     body ではなく html に余白を持たせるので、元のレイアウトを壊さない。
     position:fixed で組んだ画面には効かないので、その場合は自分で
     env(safe-area-inset-*) を足すこと */
  @supports (padding: env(safe-area-inset-top)) {
    html {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background: #0f1216;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hd">
    <div class="clock" id="clock">--:--<span id="dow"></span></div>
    <div class="here" onclick="locate()">いま居る場所<b id="hereName">家</b><small id="hereGeo" class="no">タップで現在地を取る</small></div>
  </div>

  <!-- ========== 今 ========== -->
  <section class="pg on" id="pg-now">
    <div id="nowBody"></div>
  </section>

  <!-- ========== 予定 ========== -->
  <section class="pg" id="pg-anc">
    <h2>これだけは譲れないこと</h2>
    <p class="tiny">時間が決まってて動かせないもの。ここが逆算の起点になる。</p>
    <div class="card">
      <div class="f">
        <label>なに</label>
        <input type="text" id="aT" placeholder="例：バイト / 病院 / 提出">
        <label>いつ</label>
        <input type="datetime-local" id="aAt">
        <label>どこ（行く必要がある？）</label>
        <select id="aP"></select>
        <button class="btn" onclick="addAnchor()">＋ 追加する</button>
      </div>
    </div>
    <div id="ancList"></div>
  </section>

  <!-- ========== やること ========== -->
  <section class="pg" id="pg-task">
    <h2>やりたい・やるべきこと</h2>
    <div class="card">
      <div class="f">
        <label>なに</label>
        <input type="text" id="tT" placeholder="例：洗濯 / 買い物 / 資料つくる">
        <label>どれくらいかかる？</label>
        <div class="chips" id="tMinChips"></div>
        <input type="number" id="tMin" value="30" min="5" step="5">
        <label>どこでやる？</label>
        <select id="tP"></select>
        <button class="btn" onclick="addTask()">＋ 追加する</button>
      </div>
    </div>
    <div id="taskList"></div>

    <h2>場所と移動時間</h2>
    <p class="tiny">「いま居る場所」から片道なんぷんか。ざっくりでOK。移動したら直してね。</p>
    <div id="placeList"></div>
    <div class="card">
      <div class="two">
        <input type="text" id="pN" placeholder="場所の名前">
        <input type="number" id="pM" placeholder="片道 分" min="0" step="5">
      </div>
      <div style="height:8px"></div>
      <button class="btn sec" onclick="addPlace()">＋ 場所を足す</button>
    </div>

    <h2>設定</h2>
    <div class="card">
      <div class="f">
        <label>いま居る場所の名前</label>
        <input type="text" id="sHere" oninput="S.hereName=this.value;save();render()">
        <label>出発前の余裕（分）— 準備・忘れ物・迷いの分</label>
        <input type="number" id="sBuf" min="0" step="5" oninput="S.buffer=+this.value||0;save();render()">
        <label>見積りの甘さ補正（%）— 全部の所要時間をこれだけ増やす</label>
        <input type="number" id="sFudge" min="0" step="10" oninput="S.fudge=+this.value||0;save();render()">
      </div>
      <div style="height:10px"></div>
      <button class="btn sec" onclick="if(confirm('全部消す？'))reset()">全部リセット</button>
    </div>

    <h2>バックアップ</h2>
    <div class="card">
      <div class="two">
        <button class="btn sec" onclick="exportBackup()">書き出す</button>
        <button class="btn sec" onclick="document.getElementById('bkFile').click()">読み込む</button>
      </div>
      <input type="file" id="bkFile" accept="application/json,.json" style="display:none" onchange="importBackup(this)">
      <div style="height:10px"></div>
      <p class="tiny">予定・やること・場所は、この端末の中だけに保存されます（ネットには送られません）。
      ホーム画面から削除すると消えるので、ときどき書き出してください。<br>
      現在地は移動時間の計算にその場で使うだけで、どこにも送信しません。</p>
    </div>
  </section>

  <!-- ========== ひらめき ========== -->
  <section class="pg" id="pg-idea">
    <h2>いま思いついた、これ入る？</h2>
    <p class="tiny">「海行きたい」みたいなやつを、やる前に判定する。</p>
    <div class="card">
      <div class="f">
        <label>なにしたい</label>
        <input type="text" id="iT" placeholder="例：海に行く">
        <label>そこで過ごす時間</label>
        <div class="chips" id="iMinChips"></div>
        <input type="number" id="iMin" value="60" min="5" step="5">
        <label>どこ</label>
        <select id="iP"></select>
        <div class="two" id="iNewWrap" style="display:none">
          <input type="text" id="iNewN" placeholder="場所の名前">
          <input type="number" id="iNewM" placeholder="片道 分" step="5">
        </div>
        <button class="btn" onclick="judge()">入るか見る</button>
      </div>
    </div>
    <div id="idOut"></div>
  </section>
</div>

<nav>
  <button class="on" data-p="now"><i>◎</i>いま</button>
  <button data-p="anc"><i>⚑</i>譲れない</button>
  <button data-p="task"><i>☰</i>やること</button>
  <button data-p="idea"><i>✦</i>ひらめき</button>
</nav>

<script>
/* ---------- state ---------- */
const KEY='gyakusan.v1';
const DEF={
  hereName:'家', buffer:10, fudge:20, here:null,
  places:[{id:'p1',name:'職場',min:30},{id:'p2',name:'スーパー',min:10}],
  anchors:[], tasks:[]
};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign({},DEF,JSON.parse(r)):structuredClone(DEF)}catch(e){return structuredClone(DEF)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function reset(){S=structuredClone(DEF);save();render()}
const uid=()=>Math.random().toString(36).slice(2,9);
const place=id=>S.places.find(p=>p.id===id)||null;

/* ---------- time helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const DOW=['日','月','火','水','木','金','土'];
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function dur(m){m=Math.round(m);if(m<0)m=0;const h=Math.floor(m/60),r=m%60;
  return h?(r?h+'時間'+r+'分':h+'時間'):r+'分'}
function localISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function plus(d,m){return new Date(d.getTime()+m*60000)}
const fudged=m=>Math.round(m*(1+(S.fudge||0)/100));

/* ---------- core: 逆算 ---------- */
function plan(){
  const now=new Date();
  const up=S.anchors.map(a=>({...a,d:new Date(a.at)}))
    .filter(a=>!isNaN(a.d)&&a.d>now).sort((x,y)=>x.d-y.d);
  const A=up[0]||null;
  let travel=0,leaveBy=null,free=Infinity;
  if(A){
    const p=place(A.placeId);
    travel=p?p.min:0;
    leaveBy=plus(A.d,-(travel+(S.buffer||0)));
    free=(leaveBy-now)/60000;
  }
  return {now,A,up,travel,leaveBy,free};
}

/* タスクが今の空き時間に入るか */
function fit(t,P){
  const need=fudged(t.min);
  const p=place(t.placeId);
  if(!p){ // どこでもOK
    return {kind:'any',need,ok:P.free>=need,short:need-P.free};
  }
  if(P.A && P.A.placeId===t.placeId){ // 予定と同じ場所 → 早く行ってそこでやる
    const total=p.min+need+(S.buffer||0);
    const limit=(P.A.d-P.now)/60000;
    return {kind:'onway',need:total,ok:limit>=total,short:total-limit,
            note:'先に'+p.name+'へ行ってそこでやる'};
  }
  const total=p.min*2+need; // 往復
  return {kind:'trip',need:total,ok:P.free>=total,short:total-P.free,
          note:p.name+'まで往復'+(p.min*2)+'分'};
}

/* ---------- 現在地 / 移動時間の推定 ---------- */
const MODES={walk:{n:'徒歩',v:4.5,f:0},bike:{n:'自転車',v:13,f:2},
             car:{n:'車',v:25,f:5},train:{n:'電車・バス',v:30,f:12}};
const DETOUR=1.25; // 直線距離→実際の道のり補正
function kmBetween(a,b){
  const R=6371,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function estimate(p){
  if(!S.here||p.lat==null)return null;
  const d=kmBetween(S.here,p)*DETOUR, M=MODES[p.mode||'walk'];
  return {km:d, min:Math.max(1,Math.round(d/M.v*60+M.f)), mode:M.n};
}
function locate(){
  if(!navigator.geolocation)return alert('この端末では現在地が取れません');
  const el=document.getElementById('hereGeo'); el.textContent='取得中…'; el.className='';
  navigator.geolocation.getCurrentPosition(pos=>{
    S.here={lat:pos.coords.latitude,lng:pos.coords.longitude,
            acc:Math.round(pos.coords.accuracy),at:Date.now()};
    let n=0;
    S.places.forEach(p=>{const e=estimate(p); if(e&&!p.manual){p.min=e.min;n++}});
    save();render();
    if(n)toast(n+'か所の移動時間を更新した');
  },err=>{
    render();
    alert('現在地が取れませんでした（'+err.message+'）\n・位置情報の許可を確認\n・https か localhost でないと使えません');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
function pinPlace(id){
  if(!navigator.geolocation)return alert('この端末では現在地が取れません');
  navigator.geolocation.getCurrentPosition(pos=>{
    const p=place(id); if(!p)return;
    p.lat=pos.coords.latitude; p.lng=pos.coords.longitude;
    save();render();toast(p.name+' の場所を覚えた');
  },e=>alert('取れませんでした：'+e.message),{enableHighAccuracy:true,timeout:12000});
}
function setMode(id,m){const p=place(id);if(!p)return;p.mode=m;
  const e=estimate(p); if(e&&!p.manual)p.min=e.min; save();render()}
function useEst(id){const p=place(id);const e=estimate(p);if(!e)return;
  p.min=e.min;p.manual=false;save();render()}
function toast(m){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#2c3947;'
      +'color:#e8edf3;padding:11px 18px;border-radius:99px;font-size:13px;z-index:99;transition:opacity .3s';
    document.body.appendChild(t)}
  t.textContent=m;t.style.opacity='1';
  clearTimeout(t._x);t._x=setTimeout(()=>t.style.opacity='0',2200);
}

/* ---------- render ---------- */
function render(){
  const P=plan();
  document.getElementById('clock').innerHTML=hm(P.now)+'<span>'+DOW[P.now.getDay()]+'</span>';
  document.getElementById('hereName').textContent=S.hereName||'ここ';
  const hg=document.getElementById('hereGeo');
  if(S.here){const mn=Math.round((Date.now()-S.here.at)/60000);
    hg.className='';hg.textContent='📍 取得ずみ ±'+S.here.acc+'m'+(mn>2?'（'+mn+'分前）':'');}
  else if(hg.textContent!=='取得中…'){hg.className='no';hg.textContent='タップで現在地を取る';}
  const sh=document.getElementById('sHere'); if(document.activeElement!==sh)sh.value=S.hereName||'';
  const sb=document.getElementById('sBuf'); if(document.activeElement!==sb)sb.value=S.buffer;
  const sf=document.getElementById('sFudge'); if(document.activeElement!==sf)sf.value=S.fudge;
  renderNow(P); renderAnc(P); renderTask(P); syncSelects();
}

function sched(P){
  const live=S.tasks.filter(t=>!t.done);
  let acc=0;
  const rows=live.map(t=>{
    const f=fit(t,P), on=t.on!==false;
    if(on)acc+=f.need;
    return {t,f,on,cum:acc};
  });
  return {rows,acc,bal:P.free-acc};
}

function renderNow(P){
  const el=document.getElementById('nowBody'); let h='';
  const SC=sched(P), rows=SC.rows, bal=SC.bal;

  if(!P.A){
    h+='<div class="hero"><div class="lbl">約束（動かせない予定）</div>'
      +'<div class="big" style="font-size:26px">まだ入ってない</div>'
      +'<div class="sub">「譲れない」タブで1つ入れると、そこまで何時間あるかが出る。</div></div>';
  }else{
    const p=place(P.A.placeId), late=P.free<=0;
    h+='<div class="hero'+(late?' go':'')+'">'
      +'<div class="lbl">'+esc(P.A.title)+'（'+hm(P.A.d)+(p?' ・'+esc(p.name):'')+'）まで</div>'
      +'<div class="big">'+(late?'もう出る時間':'あと '+dur(P.free))+'</div>'
      +'<div class="sub">'+(p?hm(P.leaveBy)+' に出発。移動'+p.min+'分＋余裕'+S.buffer+'分はもう引いてある。'
                            :hm(P.leaveBy)+' には手を止める。')+'</div>'
      +'<div class="ldg">'
      +'<div class="lr"><span>自由に使える時間</span><b>'+dur(P.free)+'</b></div>';
    const sel=rows.filter(r=>r.on);
    if(sel.length) sel.forEach(r=>{
      h+='<div class="lr m"><span>− '+esc(r.t.title)+(r.f.kind!=='any'?' <i>移動込</i>':'')+'</span><b>−'+dur(r.f.need)+'</b></div>';
    }); else h+='<div class="lr m"><span>引くものが選ばれてない</span><b>0分</b></div>';
    h+='<div class="lr tot'+(bal<0?' bad':'')+'"><span>'+(bal<0?'足りない':'のこり')+'</span><b>'
      +(bal<0?'−'+dur(-bal):dur(bal))+'</b></div></div>'
      +'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,bal/Math.max(1,P.free)*100))
      +'%;background:'+(bal<0?'var(--ng)':'var(--ok)')+'"></i></div></div>';
  }

  const on=rows.filter(r=>r.on);
  if(on.length){
    const r=on[0];
    h+='<div class="nowtask"><div class="lbl">まず これ だけやる</div>'
      +'<div class="t">'+esc(r.t.title)+'</div>'
      +'<div class="m">'+dur(r.f.need)+(r.f.note?' ／ '+r.f.note:' ／ ここでできる')
      +'　→ '+hm(plus(P.now,r.f.need))+' に終わる</div></div>';
  }

  const here=rows.filter(r=>r.f.kind==='any'), go=rows.filter(r=>r.f.kind!=='any');
  h+='<h2>🌀 いまここでできる（移動いらない）</h2>';
  h+=here.length?here.map(r=>rowHTML(r,'g',dur(fudged(r.t.min)))).join(''):'<div class="empty">なし</div>';
  h+='<h2>📍 行かないとできない</h2>';
  h+=go.length?go.map(r=>rowHTML(r,'a',dur(r.f.need)+'（移動込）')).join(''):'<div class="empty">なし</div>';
  h+='<div class="tiny" style="padding:2px 4px 8px">タップで 入れる／外す。外したものは引き算に入らない。</div>';

  if(P.A){
    h+='<h2>逆算タイムライン</h2><div class="card"><div class="tl">';
    let c=new Date(P.now);
    h+=tli(hm(c),'いま','');
    on.forEach(r=>{
      const e=plus(c,r.f.need);
      const over=e>P.leaveBy;
      h+=tli(hm(c)+'–'+hm(e),(over?'⚠️ ':'')+esc(r.t.title)+(over?'（はみ出る）':''),over?'f':'');
      c=e;
    });
    if(bal>0)h+=tli(hm(c)+'–'+hm(P.leaveBy),'空き '+dur(bal),'');
    const p=place(P.A.placeId);
    if(p)h+=tli(hm(P.leaveBy),'🚶 出発（'+esc(p.name)+'へ '+p.min+'分）','k');
    h+=tli(hm(P.A.d),'⚑ '+esc(P.A.title),'f');
    h+='</div></div>';
  }
  h+='<div class="tiny" style="padding:4px 4px 20px">※ 所要時間は入力に +'+(S.fudge||0)+'% した数字。場所つきは片道×2の往復で計算。</div>';
  el.innerHTML=h;
}
function tli(t,x,c){return '<div class="tli '+c+'"><time>'+t+'</time><div>'+x+'</div></div>'}
function rowHTML(r,cls,met){
  const t=r.t;
  return '<div class="row '+cls+(r.on?'':' off')+'" onclick="toggleOn(\''+t.id+'\')">'
    +'<div class="ck'+(r.on?' on':'')+'">'+(r.on?'✓':'')+'</div>'
    +'<div class="ttl">'+esc(t.title)+'</div>'
    +'<div class="met">'+met+'</div>'
    +'<button class="dn" onclick="event.stopPropagation();doneTask(\''+t.id+'\')">済</button></div>';
}
function toggleOn(id){const t=S.tasks.find(x=>x.id===id);if(t)t.on=(t.on===false);save();render()}

function renderAnc(P){
  const el=document.getElementById('ancList');
  if(!S.anchors.length){el.innerHTML='<div class="empty">まだ無い。<br>「◯時にここに居ないといけない」を入れる。</div>';return}
  el.innerHTML=S.anchors.slice().sort((a,b)=>new Date(a.at)-new Date(b.at)).map(a=>{
    const d=new Date(a.at),p=place(a.placeId),past=d<P.now;
    return '<div class="row'+(past?' x':'')+'"><div class="ico">⚑</div><div class="ttl">'+esc(a.title)
      +(p?'<span class="tagp">'+esc(p.name)+'</span>':'')+'</div>'
      +'<div class="met">'+(d.getDate()!==P.now.getDate()?(d.getMonth()+1)+'/'+d.getDate()+' ':'')+hm(d)+'</div>'
      +'<button class="del" onclick="del(\'anchors\',\''+a.id+'\')">×</button></div>';
  }).join('');
}

function renderTask(P){
  const el=document.getElementById('taskList');
  const live=S.tasks.filter(t=>!t.done);
  el.innerHTML=live.length?live.map(t=>{
    const p=place(t.placeId);
    return '<div class="row"><div class="ico">'+(p?'📍':'🌀')+'</div><div class="ttl">'+esc(t.title)
      +(p?'<span class="tagp">'+esc(p.name)+'</span>':'<span class="taga">どこでも</span>')+'</div>'
      +'<div class="met">'+t.min+'分</div>'
      +'<button class="del" onclick="del(\'tasks\',\''+t.id+'\')">×</button></div>';
  }).join(''):'<div class="empty">まだ無い</div>';

  document.getElementById('placeList').innerHTML=S.places.map(p=>{
    const e=estimate(p);
    let h='<div class="pcard"><div class="top"><div class="ico">📍</div>'
      +'<div class="ttl">'+esc(p.name)+'</div>'
      +'<button class="gps'+(p.lat!=null?' has':'')+'" onclick="pinPlace(\''+p.id+'\')">'
      +(p.lat!=null?'✓ 場所を覚えてる':'ここで登録')+'</button>'
      +'<button class="del" onclick="del(\'places\',\''+p.id+'\')">×</button></div>'
      +'<div class="ctl">片道 <input type="number" value="'+p.min+'" step="5" '
      +'onchange="setMin(\''+p.id+'\',this.value)"> 分'
      +'<select onchange="setMode(\''+p.id+'\',this.value)">'
      +Object.keys(MODES).map(k=>'<option value="'+k+'"'+((p.mode||'walk')===k?' selected':'')+'>'+MODES[k].n+'</option>').join('')
      +'</select></div>';
    if(e)h+='<div class="est">現在地から <b>'+e.km.toFixed(1)+'km</b> → '+e.mode+'で <b>約'+e.min+'分</b>'
      +(p.min!==e.min?' <button class="gps" style="padding:3px 8px;margin-left:4px" onclick="useEst(\''+p.id+'\')">これを使う</button>':'')
      +'</div>';
    else if(p.lat!=null)h+='<div class="est">現在地を取ると自動で分数を出せる</div>';
    else h+='<div class="est">その場所に居るときに「ここで登録」を押すと、次から距離で自動計算できる</div>';
    return h+'</div>';
  }).join('')||'<div class="empty">場所がまだ無い</div>';
}

function syncSelects(){
  const opts=(none)=>'<option value="">'+none+'</option>'
    +S.places.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'（片道'+p.min+'分）</option>').join('');
  ['aP','tP'].forEach(id=>{const e=document.getElementById(id),v=e.value;
    e.innerHTML=opts(id==='aP'?'行かなくていい':'どこでもできる');e.value=v});
  const i=document.getElementById('iP'),v=i.value;
  i.innerHTML=opts('どこでもできる')+'<option value="__new">＋ 新しい場所…</option>';i.value=v;
}

/* ---------- actions ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function doneTask(id){const t=S.tasks.find(x=>x.id===id);if(t)t.done=true;save();render()}
function setMin(id,v){const p=place(id);if(p){p.min=Math.max(0,+v||0);p.manual=true}save();render()}
function addAnchor(){
  const t=document.getElementById('aT').value.trim(),at=document.getElementById('aAt').value;
  if(!t||!at)return alert('なにと、いつ を入れてね');
  S.anchors.push({id:uid(),title:t,at,placeId:document.getElementById('aP').value||null});
  save();document.getElementById('aT').value='';render();
}
function addTask(){
  const t=document.getElementById('tT').value.trim();
  if(!t)return alert('なにをやる？');
  S.tasks.push({id:uid(),title:t,min:+document.getElementById('tMin').value||30,
    placeId:document.getElementById('tP').value||null,done:false,on:true});
  save();document.getElementById('tT').value='';render();
}
function addPlace(){
  const n=document.getElementById('pN').value.trim();
  if(!n)return alert('場所の名前は？');
  S.places.push({id:uid(),name:n,min:Math.max(0,+document.getElementById('pM').value||0),mode:'walk'});
  save();document.getElementById('pN').value='';document.getElementById('pM').value='';render();
}

/* ---------- ひらめき判定 ---------- */
function judge(){
  const P=plan(), SC=sched(P);
  const title=document.getElementById('iT').value.trim()||'それ';
  const stay=+document.getElementById('iMin').value||60;
  let pid=document.getElementById('iP').value,p=null;
  if(pid==='__new'){
    const n=document.getElementById('iNewN').value.trim();
    const m=+document.getElementById('iNewM').value||0;
    if(!n)return alert('場所の名前を入れて');
    p={id:uid(),name:n,min:m};S.places.push(p);save();pid=p.id;
    syncSelects();document.getElementById('iP').value=pid;
  }else if(pid)p=place(pid);

  const f=fit({title,min:stay,placeId:pid||null},P);
  const out=document.getElementById('idOut');
  const bal=SC.bal, after=bal-f.need;
  let h='';

  if(!P.A){
    h='<div class="vd y"><div class="h">いける</div><div class="muted">約束が入ってないから時間の制限が無い。'
      +'かかるのは '+dur(f.need)+'（'+hm(P.now)+' → '+hm(plus(P.now,f.need))+'）。</div></div>';
  }else{
    h+='<div class="vd '+(after>=0?'y':'n')+'"><div class="h">'+(after>=0?'間に合う':'間に合わない')+'</div>'
      +'<div class="muted">'+(after>=0
        ? 'やることを全部やっても <b style="color:var(--tx)">'+dur(after)+'</b> 余る。'
        : '<b style="color:var(--tx)">'+dur(-after)+' 足りない。</b>')+'</div></div>';
    h+='<div class="card"><div class="ldg" style="border:none;margin:0;padding:0">'
      +'<div class="lr"><span>'+esc(P.A.title)+'まで使える</span><b>'+dur(P.free)+'</b></div>'
      +'<div class="lr m"><span>− やること'+SC.rows.filter(r=>r.on).length+'件</span><b>−'+dur(SC.acc)+'</b></div>'
      +'<div class="lr m"><span>− '+esc(title)+(p?' <i>'+esc(p.name)+' 往復'+(p.min*2)+'分＋'+stay+'分</i>':'')+'</span><b>−'+dur(f.need)+'</b></div>'
      +'<div class="lr tot'+(after<0?' bad':'')+'"><span>'+(after<0?'足りない':'のこり')+'</span><b>'
      +(after<0?'−'+dur(-after):dur(after))+'</b></div></div>';
    if(after>=0){
      const st=fudged(stay);
      h+='<div style="height:12px"></div><div class="tl">'
        +(p? tli(hm(P.now),'いま出る','')
             +tli(hm(plus(P.now,p.min)),esc(p.name)+' 着','')
             +tli(hm(plus(P.now,p.min+st)),'ここまで。切り上げる','k')
             +tli(hm(plus(P.now,f.need)),'戻る','')
           : tli(hm(P.now),'いま始める','')
             +tli(hm(plus(P.now,f.need)),'終わり','k'))
        +tli(hm(P.leaveBy),'🚶 '+esc(P.A.title)+'へ出発','f')
        +'</div>';
    }else{
      const cut=Math.max(0,stay+after);
      h+='<div style="height:12px"></div><div class="muted" style="font-size:14px">どうする？</div><div style="height:6px"></div>'
        +'<div class="tiny">'
        +(cut>=10?'・滞在を <b style="color:var(--tx)">'+dur(Math.floor(cut/5)*5)+'</b> に縮めれば入る<br>':'')
        +'・やることをどれか外す（'+dur(-after)+' ぶん）<br>'
        +'・'+esc(P.A.title)+' のあと（'+hm(P.A.d)+'〜）に回す</div>';
    }
    h+='<div style="height:12px"></div>'
      +'<button class="btn sec" onclick="stash('+JSON.stringify(title).replace(/"/g,'&quot;')+','+stay+',\''+(pid||'')+'\')">やることリストに置いとく</button></div>';
  }
  out.innerHTML=h;
}
function stash(title,min,pid){
  S.tasks.push({id:uid(),title,min,placeId:pid||null,done:false,on:true});save();render();
  document.getElementById('idOut').innerHTML='<div class="card muted">「'+esc(title)+'」をやることリストに置いた。</div>';
}

/* ---------- バックアップ ---------- */
function exportBackup(){
  const blob=new Blob([JSON.stringify({key:KEY,savedAt:new Date().toISOString(),state:S},null,1)],
    {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='逆算バックアップ_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('✓ 書き出した');
}
function importBackup(input){
  const file=input.files&&input.files[0]; input.value='';
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      const st=d.state||d;
      if(!st||!Array.isArray(st.tasks))throw new Error('中身が逆算のデータの形になっていません');
      if(!confirm('今のデータを、このファイルの内容（予定'+(st.anchors||[]).length
        +'件／やること'+st.tasks.length+'件）で置き換えます。よろしいですか？'))return;
      S=Object.assign({},DEF,st); save(); render();
      toast('✓ 読み込んだ');
    }catch(e){ alert('読み込めませんでした: '+(e&&e.message||e)); }
  };
  fr.readAsText(file);
}

/* ---------- ui wiring ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id==='pg-'+b.dataset.p));

});
function chipRow(el,input,vals){
  el.innerHTML=vals.map(v=>'<button class="chip" data-v="'+v+'">'+(v>=60?(v/60)+'時間':v+'分')+'</button>').join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    input.value=c.dataset.v;
    el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  });
}
chipRow(document.getElementById('tMinChips'),document.getElementById('tMin'),[10,15,30,60,90,120]);
chipRow(document.getElementById('iMinChips'),document.getElementById('iMin'),[30,60,120,180,240]);

document.getElementById('aAt').value=localISO(new Date(Date.now()+3*3600000));

/* ---------- 版チェック（直したコードを端末に届ける） ---------- */
const APP_VERSION='2026-08-20-1';
(function(){const e=document.createElement('div');e.textContent='v'+APP_VERSION;
  e.style.cssText='text-align:center;color:#3d4652;font-size:10px;padding:6px 0 20px';
  document.querySelector('.wrap').appendChild(e);})();
let _ck=false;
async function checkVersion(){
  if(_ck||!navigator.onLine)return; _ck=true;
  try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});
    if(r.ok){const l=(await r.text()).trim();
      if(l&&l!==APP_VERSION&&sessionStorage.getItem('reloaded_for')!==l){
        sessionStorage.setItem('reloaded_for',l);location.reload();}}
  }catch(e){}finally{_ck=false}
}
checkVersion();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkVersion();render()}});

render();
setInterval(render,15000);
setInterval(()=>{const n=new Date();document.getElementById('clock').innerHTML=hm(n)+'<span>'+DOW[n.getDay()]+'</span>'},1000);
